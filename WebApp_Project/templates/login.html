{% extends "base.html" %}
{% block title %}Sign in — TOGETHR{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="card-tg p-4">
    <h3 class="fw-bold mb-1">Welcome back</h3>
    <p class="text-muted mb-4">Sign in to your TOGETHR account</p>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input type="text" name="username" id="username" class="form-control"
               placeholder="your_username" required autofocus />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" name="password" id="password" class="form-control"
               placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-tg w-100 mb-3">Sign in</button>
    </form>

    <p class="text-center text-muted mb-0">
      Don't have an account? <a href="{% url 'register' %}" class="text-tg fw-semibold">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
