{% extends "base.html" %}
{% block title %}Access denied · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-code" aria-hidden="true">403</p>
  <h1>Access denied</h1>
  <p class="lead">You don't have permission to view this page. If you think that's a mistake, contact an administrator.</p>
  <div class="error-actions">
    <a class="btn btn-primary" href="{% url 'core:landing' %}">Back to home</a>
    <button type="button" class="btn btn-secondary" onclick="history.length > 1 ? history.back() : (location.href='{% url 'core:landing' %}')">Go back</button>
  </div>
</section>
{% endblock %}
