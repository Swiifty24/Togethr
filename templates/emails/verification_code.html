<!doctype html>
<html><body style="margin:0;padding:24px;background:#F7F8FC;font-family:Arial,Helvetica,sans-serif;color:#1B2147;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
    <table role="presentation" width="480" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border:1px solid #E3E6F2;border-radius:16px;padding:32px;">
      <tr><td style="font-size:20px;font-weight:700;color:#4B55C8;padding-bottom:16px;">{{ site_name }}</td></tr>
      <tr><td style="font-size:16px;line-height:1.5;padding-bottom:8px;">Hi {{ user.get_short_name }}, use this code to verify your email address:</td></tr>
      <tr><td align="center" style="padding:20px 0;">
        <div style="display:inline-block;font-size:34px;letter-spacing:10px;font-weight:700;background:#EEF0FC;color:#3F49B2;padding:16px 24px;border-radius:12px;">{{ code }}</div>
      </td></tr>
      <tr><td style="font-size:14px;line-height:1.5;color:#646B8A;">This code expires in {{ minutes }} minutes. If you didn't create an account, you can safely ignore this email.</td></tr>
    </table>
  </td></tr></table>
</body></html>
