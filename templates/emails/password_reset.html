<!doctype html>
<html><body style="margin:0;padding:24px;background:#F6F7FA;font-family:Arial,Helvetica,sans-serif;color:#0F172A;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
    <table role="presentation" width="480" cellspacing="0" cellpadding="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E9EEF5;border-radius:16px;padding:32px;">
      <tr><td style="font-size:20px;font-weight:800;color:#FF5A43;padding-bottom:16px;">Togethr</td></tr>
      <tr><td style="font-size:16px;line-height:1.5;padding-bottom:20px;">Hi {{ user.get_short_name }}, we received a request to reset your password. The link works once and expires in one hour.</td></tr>
      <tr><td align="center" style="padding-bottom:20px;">
        <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#FF5A43;color:#0F172A;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:10px;">Choose a new password</a>
      </td></tr>
      <tr><td style="font-size:14px;line-height:1.5;color:#5B6071;">Your username is <strong>{{ user.get_username }}</strong>. If you didn't ask for this, you can ignore this email — your password won't change.</td></tr>
    </table>
  </td></tr></table>
</body></html>
