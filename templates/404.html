{% extends "base.html" %}
{% block title %}Page not found · {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p class="lead">We couldn't find the page you were looking for. It may have moved, or the link may be mistyped.</p>
  <div class="error-actions">
    <a class="btn btn-primary" href="{% url 'core:landing' %}">Back to home</a>
    <button type="button" class="btn btn-secondary" onclick="history.length > 1 ? history.back() : (location.href='{% url 'core:landing' %}')">Go back</button>
  </div>
</section>
{% endblock %}
