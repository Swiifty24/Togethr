<div class="pw-rules" data-password-rules{% if optional %} data-optional{% endif %}>
  <p class="pw-rules-title">Your password needs:</p>
  <ul>
    <li data-rule="length"><span class="rule-dot" aria-hidden="true"></span>At least 8 characters<span class="sr-only" data-sr></span></li>
    <li data-rule="upper"><span class="rule-dot" aria-hidden="true"></span>An uppercase letter (A–Z)<span class="sr-only" data-sr></span></li>
    <li data-rule="lower"><span class="rule-dot" aria-hidden="true"></span>A lowercase letter (a–z)<span class="sr-only" data-sr></span></li>
    <li data-rule="digit"><span class="rule-dot" aria-hidden="true"></span>A number (0–9)<span class="sr-only" data-sr></span></li>
    <li data-rule="special"><span class="rule-dot" aria-hidden="true"></span>A special character (@ # $ % ! &amp;)<span class="sr-only" data-sr></span></li>
    <li data-rule="common"><span class="rule-dot" aria-hidden="true"></span>No common words or patterns<span class="sr-only" data-sr></span></li>
  </ul>
  <p class="pw-match" data-match-status aria-live="polite"></p>
</div>
{{ fragments|json_script:"weak-fragments" }}
