{% if messages %}
<div class="messages" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{{ message.level_tag|default:'info' }}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">
    <svg class="icon" aria-hidden="true"><use href="#i-{% if message.level_tag == 'success' %}check{% elif message.level_tag == 'error' or message.level_tag == 'warning' %}alert{% else %}info{% endif %}"/></svg>
    <span>{{ message }}</span>
    <button type="button" class="alert-close" data-dismiss aria-label="Dismiss message"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  {% endfor %}
</div>
{% endif %}
